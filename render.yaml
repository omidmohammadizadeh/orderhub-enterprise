# ─────────────────────────────────────────────────────────
# OrderHub — Render Blueprint
#
# Deploys:
#   - API (NestJS) — Web Service, port 4000
#   - Worker (NestJS) — Background Worker (no HTTP)
#   - Web (Next.js) — Web Service, port 3000
#
# External services (configure manually):
#   - Database: Supabase Postgres → set DATABASE_URL env var
#   - Redis:    Upstash Redis     → set REDIS_URL and QUEUE_REDIS_URL env vars
#
# Usage:
#   1. Push this file to your GitHub repo
#   2. In Render dashboard → New → Blueprint → connect your repo
#   3. Fill in required env vars (marked *required*)
#   4. Deploy
#
# See STAGING_ENVIRONMENT.md for full setup instructions.
# ─────────────────────────────────────────────────────────

services:
  # ── API — NestJS REST + WebSocket ────────────────────────
  - type: web
    name: orderhub-api
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.api
    dockerContext: .
    region: frankfurt
    # Standard (2GB / 1 CPU). Raised from starter on 2026-08-22: CPU was the
    # real constraint — 0.5 CPU pinned at 100% produced 5-26 second responses
    # on the storefront. The service is Blueprint-managed, so this MUST match
    # what the dashboard is set to; if the blueprint still said starter, the
    # next sync would quietly downgrade it back and undo the money spent.
    plan: standard
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # V8 sizes its own heap from the container and lands FAR below it. On
      # 2026-08-22 the API died with "Reached heap limit" at a 252MB heap while
      # Render's memory graph showed the container at ~31% of 512MB — ~300MB
      # sitting unused that Node refused to touch.
      #
      # MUST be re-sized whenever the plan changes. It was 400 for the 512MB
      # starter; on Standard's 2GB, leaving it at 400 would have CAPPED the
      # process below what the instance now provides — paying for 2GB and
      # using a fifth of it.
      #
      # 1536 of 2048: the remaining 512MB is for native allocations, buffers
      # and the runtime outside the JS heap. Set too close to the limit and the
      # CONTAINER gets OOM-killed instead, which is a harder failure than a
      # heap error.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      # ── Required: set these in the Render dashboard or via secrets ──
      - key: DATABASE_URL
        sync: false      # Supabase pooled connection (port 6543, ?pgbouncer=true)
      - key: DIRECT_URL
        sync: false      # Supabase direct connection (port 5432) — used by Prisma for migrations
      - key: REDIS_URL
        sync: false
      - key: QUEUE_REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true  # Render generates a random value on first deploy
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false      # Must be 64 hex chars — generate with: openssl rand -hex 32
      # ── App URLs ──
      - key: APP_URL
        fromService:
          type: web
          name: orderhub-web
          property: host
      - key: API_PUBLIC_URL
        fromService:
          type: web
          name: orderhub-api
          property: host
      - key: SOCKET_CORS_ORIGIN
        fromService:
          type: web
          name: orderhub-web
          property: host
      # Explicit public CORS origin for browser requests.
      # fromService.property:host returns the bare internal hostname (no protocol,
      # no .onrender.com) which doesn't match the browser's Origin header.
      # This must match the exact URL users see in their browser.
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.orderhubsolutions.com,https://orderhubsolutions.com,https://orderhub-web.onrender.com
      # ── Stripe (set manually) ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # ── SMS (Twilio or Telnyx — one env var switches every send path) ──
      # SMS_PROVIDER: TWILIO (default) | TELNYX | VONAGE. Switching it moves
      # billable sends (payment links, marketing) AND system notifications at
      # once; the inbound STOP webhook accepts either provider's shape on the
      # same URL, so it doesn't need re-pointing.
      #
      # Telnyx setup: API key from Mission Control, TELNYX_FROM as either a
      # UK E.164 number or an alphanumeric sender ID, and
      # TELNYX_MESSAGING_PROFILE_ID — REQUIRED whenever the sender is a name
      # rather than a number. TELNYX_PUBLIC_KEY (Account → Keys) turns on
      # Ed25519 verification of the inbound webhook; unset means accept-all.
      # Point the profile's inbound webhook at
      # https://<api-host>/api/v1/marketing-sms/inbound
      # Phase AX — Web Push for customer order updates (the storefront PWA).
      # Generate the pair once with `npx web-push generate-vapid-keys` and set
      # both in the Render dashboard; rotating them silently invalidates every
      # existing subscription, so treat them as permanent.
      # VAPID_SUBJECT must be a mailto: or https: URL — push services reject
      # anything else and the send fails with no obvious reason.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@orderhubpos.com
      - key: SMS_PROVIDER
        value: TWILIO
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_FROM
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      # ── Optional: provider credentials ──
      - key: UBER_EATS_CLIENT_ID
        sync: false
      - key: UBER_EATS_CLIENT_SECRET
        sync: false
      - key: DELIVEROO_CLIENT_ID
        sync: false
      - key: DELIVEROO_CLIENT_SECRET
        sync: false
      # ── JWT config ──
      - key: JWT_ACCESS_TTL
        value: 15m
      # Long-lived refresh so the till / dashboard stays logged in until
      # the operator logs out manually. Sliding rotation extends it on
      # every refresh, so an actively-used device never drops out.
      - key: JWT_REFRESH_TTL
        value: 365d
      # Sign in with Apple — audience the iOS identity token is verified
      # against. Must equal the app's bundle id.
      - key: APPLE_BUNDLE_ID
        value: com.orderhubsolutions.pos
      # ── Logging ──
      - key: LOG_LEVEL
        value: info

  # ── Worker — Bull queue processor (no HTTP) ───────────────
  - type: worker
    name: orderhub-worker
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.worker
    dockerContext: .
    region: frankfurt
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false      # Must match the API service DIRECT_URL exactly
      - key: REDIS_URL
        sync: false
      - key: QUEUE_REDIS_URL
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # ── Provider credentials for status sync ──
      - key: UBER_EATS_CLIENT_ID
        sync: false
      - key: UBER_EATS_CLIENT_SECRET
        sync: false
      - key: DELIVEROO_CLIENT_ID
        sync: false
      - key: DELIVEROO_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # ── Web — Next.js dashboard ───────────────────────────────
  - type: web
    name: orderhub-web
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.web
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # NEXT_PUBLIC_* vars are baked into the Next.js bundle at build time.
      # Render passes all envVars as Docker build args automatically, so these
      # are available during `next build` via the ARG/ENV lines in Dockerfile.web.
      #
      # NEXT_PUBLIC_API_URL: base URL for the Axios REST client.
      #   Set to /api (relative) so ALL browser API requests go through the Next.js
      #   server-side rewrite proxy instead of crossing origins directly.
      #   This avoids Render's Starter proxy stripping CORS response headers.
      #   next.config.ts rewrites /api/:path* → NEXT_PUBLIC_SOCKET_URL/api/:path*.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      # NEXT_PUBLIC_SOCKET_URL: Socket.IO server root (no /api path).
      #   Socket.IO connects to the server root, not a sub-path.
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://orderhub-api-0re6.onrender.com
      # API URL for server-side rewrites (internal Render networking)
      - key: API_URL
        fromService:
          type: web
          name: orderhub-api
          property: host
      # Public URL for Next.js allowed origins (same as web service URL)
      - key: APP_URL
        fromService:
          type: web
          name: orderhub-web
          property: host
      # Stripe publishable key (safe to expose to frontend)
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      # Phase AX — Google Maps browser key (referrer-restricted) for the
      # Dispatch console map. Value is set in the Render dashboard.
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
