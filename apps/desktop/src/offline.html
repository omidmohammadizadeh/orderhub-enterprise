<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Order Hub — no connection</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: #0f172a; color: #e2e8f0;
        font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
      p { margin: 0 0 20px; color: #94a3b8; }
      button {
        font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 8px;
        background: #3b82f6; color: #fff; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 3px; }
      small { display: block; margin-top: 16px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Order Hub</h1>
      <p>Check this computer's internet connection. We'll keep trying every 10 seconds.</p>
      <button id="retry" type="button" autofocus>Try again now</button>
      <small>Orders taken on other devices are safe — nothing is lost while this screen is showing.</small>
    </main>
    <script>
      var url = new URLSearchParams(location.search).get("url") || "https://www.orderhubsolutions.com/dashboard";
      document.getElementById("retry").addEventListener("click", function () {
        location.href = url;
      });
    </script>
  </body>
</html>
